spring.application.name=disciplinetracker

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.data.mongodb.uri=${MONGODB_URI}
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:change-me-with-at-least-32-characters-secret}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE 
logging.level.org.springframework.web.HttpLogging=TRACE